name: torch-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    volumes:
      - ./prometheus.yml:/prometheus.yml
    command:
      - --config.file=/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring
networks:
  monitoring:
    external: true
    name: torch-monitoring
